name: MMM Dashboard — Daily Snapshot & Deploy

on:
  schedule:
    # Cron is UTC. Target ~6:10 AM PT weekdays with buffer before the 6:25 AM
    # notification. PT is UTC-8 (PST, Nov–Mar) or UTC-7 (PDT, Mar–Nov) —
    # GitHub cron has no DST awareness, so this runs at a fixed UTC time and
    # will drift by an hour across the DST boundary twice a year. Pick ONE:
    #   - '10 13 * * 1-5'  -> 6:10 AM PDT (UTC-7) / 5:10 AM PST — use for summer
    #   - '10 14 * * 1-5'  -> 6:10 AM PST (UTC-8) / 7:10 AM PDT — use for winter
    # Currently set for PDT (matches July 2026). Flip the hour at each DST change.
    #
    # Single pre-market run only, for now (2026-07-30) — a 13x/weekday,
    # 5-min-interval schedule with a full/light split was built and tested,
    # then intentionally rolled back in favor of simplicity while UI/data-
    # integrity cleanup is the priority. generate_snapshot.mjs still supports
    # SNAPSHOT_MODE=full|light (defaults to 'full' when unset, i.e. always,
    # since only one schedule entry exists below) — that logic was left in
    # place rather than ripped out, since an end-of-day run is planned later
    # and would reuse the same infrastructure. To bring back the wider
    # window, restore the three additional cron entries and the "Determine
    # snapshot mode" step from git history (commit 60fbf2f).
    - cron: '10 13 * * 1-5'
  workflow_dispatch: {} # allows manual "Run workflow" button for testing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run snapshot generator
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Server-side only, same as the two above — never shipped to the
          # browser. SCHWAB_REFRESH_TOKEN expires ~7 days after it's issued
          # (confirmed by Schwab support — no programmatic renewal exists),
          # so this secret needs manual updating roughly weekly via
          # mmm-dashboard/schwab-setup/get_refresh_token.mjs. If it's missing
          # or expired, generate_snapshot.mjs logs it clearly and SPX/NDX
          # fall back to Massive's end-of-day values — the run never fails.
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          # SNAPSHOT_MODE intentionally not set — script defaults to 'full'.
        run: node mmm-dashboard/generate_snapshot.mjs mmm-dashboard/mmm_dashboard.html

      - name: Commit updated snapshot
        # Reconciling generated files needs reset, NOT rebase/merge. This job
        # checks out main at the START of the run, then spends minutes fetching
        # data and building; anything pushed to main in that window makes a
        # plain `git push` non-fast-forward. The first fix here was `git pull
        # --rebase`, which correctly avoided THAT failure but then hit a worse
        # one: snapshot.json and mmm_dashboard.html are regenerated wholesale
        # every run, so git has two unrelated full-file versions and no way to
        # merge them — it raises a conflict the runner can't resolve and the
        # job dies with the run's data discarded.
        #
        # There is no merge to perform: the newest generated file is always the
        # correct one, and the newest committed code is always the correct base.
        # So: stash this run's artifacts, hard-reset onto the latest remote
        # state, lay the artifacts back down, commit. Deterministic, and no
        # conflict is possible by construction.
        run: |
          git config user.name "mmm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/snap
          cp mmm-dashboard/snapshot.json /tmp/snap/ 2>/dev/null || true
          cp mmm-dashboard/mmm_dashboard.html /tmp/snap/ 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/snap/snapshot.json mmm-dashboard/snapshot.json 2>/dev/null || true
          cp /tmp/snap/mmm_dashboard.html mmm-dashboard/mmm_dashboard.html 2>/dev/null || true

          git add mmm-dashboard/mmm_dashboard.html mmm-dashboard/snapshot.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node for pnpm build (needs >=22.13 for pnpm 11)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Daybreak (React v2)
        working-directory: mmm-dashboard/v2-src
        env:
          # VITE_ prefix is required — Vite only bakes VITE_-prefixed vars into
          # the client bundle at build time. This is the ONLY way a client-side
          # key reaches the browser: unlike MASSIVE_API_KEY/FRED_API_KEY above
          # (server-side only, never shipped), this one WILL be visible in the
          # deployed page's JS bundle to anyone who opens dev tools — that's
          # inherent to client-side API usage on a static site with no backend
          # proxy, not a mistake. Keeping it in Secrets instead of hardcoded in
          # source at least keeps it out of the git repo/commit history.
          VITE_FINNHUB_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          pnpm approve-builds --all || true
          pnpm install
          pnpm run build

      - name: Assemble v2 output
        run: |
          mkdir -p mmm-dashboard/v2
          cp -r mmm-dashboard/v2-src/dist/. mmm-dashboard/v2/
          # Same-origin relative fetch in useLiveSnapshot.ts expects ./snapshot.json
          # next to index.html — copy the just-generated snapshot alongside it.
          cp mmm-dashboard/snapshot.json mmm-dashboard/v2/snapshot.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mmm-dashboard   # scoped to this folder only — keeps turtleshell/ and focusplanner/ unpublished

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

# ── Setup checklist (one-time, not automated by this file) ──
#   1. Repo Settings > Secrets and variables > Actions > New repository secret:
#        MASSIVE_API_KEY = <your Massive Basic key>
#        FRED_API_KEY    = <your FRED key>
#        FINNHUB_API_KEY = <your Finnhub free-tier key> (client-side/public
#                           once deployed — see the Build Daybreak step's env
#                           comment for why this one differs from the two above)
#        SCHWAB_CLIENT_ID     = <Schwab app's Client ID / App Key>
#        SCHWAB_CLIENT_SECRET = <Schwab app's Client Secret>
#        SCHWAB_REFRESH_TOKEN = <from schwab-setup/get_refresh_token.mjs — expires
#                                ~7 days, re-run that script and update this secret
#                                weekly-ish. Missing/expired = SPX/NDX silently fall
#                                back to Massive's end-of-day values, run still succeeds.>
#   2. Repo Settings > Pages > Source: "GitHub Actions"
#   3. Files live in mmm-dashboard/ — mmm_dashboard.html + generate_snapshot.mjs
#      (vanilla dashboard) and mmm-dashboard/v2-src/ (React "Daybreak" source,
#      built fresh each run into mmm-dashboard/v2/ for Pages)
#   4. First run: use the "Run workflow" button (workflow_dispatch) to test
#      before trusting the cron schedule
#   5. Live URLs after first successful run:
#        <pages-base>/mmm_dashboard.html   — vanilla dashboard
#        <pages-base>/v2/                  — Daybreak (React)
#      pnpm-lock.yaml is NOT committed (only package.json), so each CI run
#      resolves fresh compatible versions via `pnpm install` rather than a
#      frozen lockfile — acceptable for a low-churn internal dashboard, but
#      worth knowing if a future dependency bump ever needs to be pinned.
