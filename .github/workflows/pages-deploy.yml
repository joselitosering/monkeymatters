name: Shadow Monkey — Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the entire docs/ folder as the Pages root.
          # The Claude pipeline writes generated HTML here:
          #   docs/index.html            — site index (auto-regenerated)
          #   docs/mmm-daily/            — daily MMM HTML files
          #   docs/mmm-weekly/           — weekly recap HTML files
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

# ── One-time setup checklist ──────────────────────────────────────────────
#   1. Repo Settings → Pages → Source: "GitHub Actions"
#   2. First deploy: use the "Run workflow" button above, or push any commit.
#   3. Live URL: https://joselitosering.github.io/monkeymatters/
#
# ── Content pipeline ──────────────────────────────────────────────────────
#   Content is generated by Claude scheduled tasks (not GitHub Actions).
#   Two scheduled tasks push commits to main — Pages deploys automatically:
#
#   DAILY  — weekdays 6:25 AM PT
#     • Claude session fetches FMP data via MCP
#     • Generates docs/mmm-daily/YYYY-MM-DD.html
#     • Regenerates docs/index.html
#     • Pushes commit via GitHub REST API
#
#   WEEKLY — Fridays 2:00 PM PT
#     • Claude session aggregates week's daily JSONs from data/daily/
#     • Grades trade ideas (deterministic Python math)
#     • Generates docs/mmm-weekly/YYYY-WWW.html
#     • Regenerates docs/index.html
#     • Pushes commit via GitHub REST API
#
#   Required GitHub secret for the Claude pipeline push:
#     SHADOW_MONKEY_PAT — fine-grained PAT with Contents: Read & Write
#     (Create at github.com/settings/personal-access-tokens/new)
