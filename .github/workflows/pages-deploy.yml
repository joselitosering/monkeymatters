name: Shadow Monkey — Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage only the public site tree
        # Pages now serves from the repo ROOT (index.html lives there),
        # but the repo root also holds things that were never meant to be
        # public: hhh/ (personal portfolio config), turtleshell/ (strategy
        # docs), scripts/, data/, template/ internals, requirements.txt.
        # Rather than publish the whole repo, copy an explicit allow-list
        # into a staging dir and publish THAT. Add a line here if a new
        # top-level public path shows up.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r mmm-daily _site/
          cp -r mmm-weekly _site/
          mkdir -p _site/docs
          cp docs/v_4_1.html docs/v_4_2.html docs/v_4_3.html _site/docs/
          echo "Staged:"
          find _site -maxdepth 2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

# ── One-time setup checklist ──────────────────────────────────────────────
#   1. Repo Settings → Pages → Source: "GitHub Actions"
#   2. First deploy: use the "Run workflow" button above, or push any commit.
#   3. Live URL: https://joselitosering.github.io/monkeymatters/
#
# ── Content pipeline ──────────────────────────────────────────────────────
#   mmm-daily.yml (data-only, no LLM) fetches real numbers from FMP on a
#   weekday cron and writes mmm-daily/YYYY-MM-DD.html + index.html directly
#   at repo root. Qualitative analysis is filled by an on-demand Claude
#   session writing data/daily/YYYY-MM-DD.insert.json (Max-plan chat usage,
#   not a separate API call) -- see scripts/fetch_mmm_data.py.
#
#   Required GitHub secrets for mmm-daily.yml:
#     SHADOW_MONKEY_PAT — fine-grained PAT, Contents: Read & Write
#       (Create at github.com/settings/personal-access-tokens/new)
#     FMP_API_KEY — Joe's existing FinancialModelingPrep key (not an
#       Anthropic/Claude key -- no LLM billing in this pipeline)
