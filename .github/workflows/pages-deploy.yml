name: Shadow Monkey — Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # shadowmonkey/ is THE public folder (Joe, 2026-08-18) -- the
          # single designated public surface, separate from the repo's
          # working internals (hhh/ portfolio config, turtleshell/ strategy
          # docs, scripts/, data/, template/ source). Nothing outside this
          # folder is ever published. docs/ (three legacy v_4_* files) is
          # currently NOT part of the public site under this design --
          # flagged as an open question, not yet resolved.
          path: shadowmonkey

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

# ── One-time setup checklist ──────────────────────────────────────────────
#   1. Repo Settings → Pages → Source: "GitHub Actions"
#   2. First deploy: use the "Run workflow" button above, or push any commit.
#   3. Live URL: https://joselitosering.github.io/monkeymatters/
#
# ── Content pipeline ──────────────────────────────────────────────────────
#   mmm-daily.yml (data-only, no LLM) fetches real numbers from FMP on a
#   weekday cron and writes shadowmonkey/mmm-daily/YYYY-MM-DD.html +
#   shadowmonkey/index.html directly. Qualitative analysis is filled by an
#   on-demand Claude session writing data/daily/YYYY-MM-DD.insert.json
#   (Max-plan chat usage, not a separate API call) -- see
#   scripts/fetch_mmm_data.py. (A Google-Drive-queue poller,
#   scripts/mmm_sync.py, previously existed as an alternate sync path and
#   was removed 2026-08-18 -- confirmed unused remnant, not part of the
#   design going forward.)
#
#   Required GitHub secrets for mmm-daily.yml:
#     SHADOW_MONKEY_PAT — fine-grained PAT, Contents: Read & Write
#       (Create at github.com/settings/personal-access-tokens/new)
#     FMP_API_KEY — Joe's existing FinancialModelingPrep key (not an
#       Anthropic/Claude key -- no LLM billing in this pipeline)
