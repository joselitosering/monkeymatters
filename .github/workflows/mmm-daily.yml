name: Shadow Monkey — Daily MMM (data pass)

# Cloud-side automation, DATA HALF ONLY. Joe is on a Max plan and does not
# want separate Anthropic API billing, so this workflow makes zero LLM
# calls -- it only pulls real numbers from FMP's REST API and fills what
# it can ground in a fetched price. Everything qualitative (advisory,
# analysis, trade ideas, lessons) stays "on demand": run a live Claude
# chat whenever Joe wants it (covered by the existing subscription), which
# writes data/daily/YYYY-MM-DD.insert.json; the NEXT run of this workflow
# (or a manual re-run) picks that file up and merges it in. No local
# machine or Desktop Commander needed for this workflow to fire -- it
# runs entirely on GitHub's servers.
on:
  schedule:
    # Target is 6:10 AM PT, not 6:25 -- the deadline is when the PUSH
    # completes, not when the job starts. Measured local runtime
    # (fetch+render+sanitize+commit+push) is ~8s; the 15-min buffer exists
    # for GitHub Actions' own runner-allocation/checkout/setup-python
    # overhead and cron-queue delay, neither of which is measurable
    # without a real triggered run on GitHub's infrastructure (can't do
    # that from here -- no gh auth). Validate against a real run's
    # reported Actions duration once secrets are in and adjust from there.
    - cron: '10 13 * * 1-5'   # ~6:10 AM PDT
    - cron: '10 14 * * 1-5'   # ~6:10 AM PST
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now regardless of time-of-day/weekday gate (manual test)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mmm-daily
  cancel-in-progress: false

# Known platform notice, not a bug here: actions/checkout@v4 and
# actions/setup-python@v5 print a "Node.js 20 deprecated, forced to
# Node 24" warning as of 2026-08-18 -- this is GitHub-wide right now,
# non-blocking, and resolves itself as GitHub patches these actions'
# bundled Node target (we're pinned to floating @v4/@v5, so we get that
# patch automatically, no edit needed here). Real deadline to actually
# track: Node.js 20 is removed from runners entirely on 2026-09-16 -- if
# this warning is STILL showing after that date, it may have gone from
# warning to failure and needs a real look then, not before.
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Must be a real PAT, not the default GITHUB_TOKEN -- pushes made
          # with GITHUB_TOKEN don't trigger pages-deploy.yml (GitHub's
          # loop-prevention). Same secret pages-deploy.yml already documents.
          token: ${{ secrets.SHADOW_MONKEY_PAT }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data + render
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Optional -- if unset, ES/NQ silently fall back to the FMP cash-
          # index proxy rather than failing the run. Schwab refresh tokens
          # die ~7 days; this secret needs manual renewal on that cadence
          # (re-run schwab_auth.py locally, update the secret value) -- see
          # chat log 2026-08-18 for why this can't self-heal in CI.
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python scripts/fetch_mmm_data.py

      - name: Commit and push
        run: |
          git config user.name "Shadow Monkey Bot"
          git config user.email "shadowmonkey-bot@users.noreply.github.com"
          git add shadowmonkey/mmm-daily shadowmonkey/index.html data/daily
          if git diff --cached --quiet; then
            echo "No changes to commit (gate no-op or duplicate run)."
            exit 0
          fi
          git commit -m "mmm-data: $(date -u +%Y-%m-%d) auto-fetched"
          git push origin HEAD:main

# ── One-time setup required before this can fire for real ──────────────────
#   1. Secret: SHADOW_MONKEY_PAT — fine-grained PAT, Contents: Read & Write,
#      scoped to this repo (github.com/settings/personal-access-tokens/new).
#   2. Secret: FMP_API_KEY — Joe's EXISTING FinancialModelingPrep API key
#      (dashboard, not a new account). Confirmed-working endpoints on his
#      current plan: index-quote, cryptocurrency-quote-short,
#      commodities-quote-short. NOT the same thing as an Anthropic/Claude
#      API key -- no LLM billing here, this is the market-data provider
#      he already has.
#   3. Optional, upgrades ES/NQ from cash-index proxy to real futures:
#      SCHWAB_CLIENT_ID, SCHWAB_CLIENT_SECRET (from .env), and
#      SCHWAB_REFRESH_TOKEN (from .secrets/schwab_token.json's
#      "refresh_token" field, minted 2026-08-18). Dies in ~7 days --
#      requires re-running schwab_auth.py locally and updating this secret
#      on that cadence. Missing/stale = silent fallback to FMP, not a
#      broken run.
#   4. Everything else (advisory, analysis, trade ideas, lessons) is filled
#      by the ON-DEMAND pass: ask Shadow Monkey in a live chat, it reads
#      data/daily/YYYY-MM-DD.json, writes .insert.json, and the next data
#      run (or a manual re-run) merges it into the live page.
#   5. First run: use "Run workflow" above (force=true) and READ the diff
#      before trusting an unattended fire -- this has never run live yet.
